[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detector"
version = "0.1.0"
description = "Multi-modal deepfake detection: Xception/InceptionV3 face ensembles, temporal attention pooling, audio branch and a Flask API."
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Srinivasan Balasubramanian" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.scripts]
dfd-extract = "deepfake_detector.preprocessing.extract:main"
dfd-train = "deepfake_detector.training.train:main"
dfd-evaluate = "deepfake_detector.evaluation.evaluate:main"
dfd-predict = "deepfake_detector.inference.cli:main"
dfd-api = "deepfake_detector.api.app:main"

[tool.setuptools.packages.find]
include = ["deepfake_detector*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "weights", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = ["B008", "RUF012", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["deepfake_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["tf: requires TensorFlow (skipped automatically when it is not installed)"]
filterwarnings = ["ignore::DeprecationWarning"]
