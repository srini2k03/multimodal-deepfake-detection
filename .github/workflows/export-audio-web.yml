name: Export browser audio model

# Converts a released audio CNN to the browser format (frontend/src/demo/audioModel.js), checks
# numerical parity of the JavaScript implementation against Python/Keras, attaches the files to
# the same release and commits the parity result. The Pages workflow deploys the model only if
# the same parity check passes again at build time.

on:
  workflow_dispatch:
    inputs:
      system:
        description: "Released audio system to export (cnn_trim or cnn)"
        default: "cnn_trim"
      release_tag:
        default: "audio-asvspoof2019-v1"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-bench.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          pip install -q -r backend/requirements-bench.txt
          pip install -q --no-deps -e backend
      - name: Export and check parity
        run: |
          sys="${{ inputs.system }}"; tag="${{ inputs.release_tag }}"
          gh release download "$tag" -p "$sys.keras" -D "$RUNNER_TEMP"
          trim=false; [ "$sys" = "cnn_trim" ] && trim=true
          python backend/scripts/export_audio_web.py --model "$RUNNER_TEMP/$sys.keras" --out "$RUNNER_TEMP/web" \
            --trim-silence "$trim" --meta results/audio/asvspoof2019_la/metrics.json --system "$sys" --release "$tag"
          node frontend/scripts/audio-parity.mjs "$RUNNER_TEMP/web" "$RUNNER_TEMP/web/audio_parity.json"
          ls -la "$RUNNER_TEMP/web"
      - name: Attach to the release
        run: gh release upload "${{ inputs.release_tag }}" "$RUNNER_TEMP"/web/audio_cnn.json "$RUNNER_TEMP"/web/audio_cnn.bin "$RUNNER_TEMP"/web/audio_fixture.json "$RUNNER_TEMP"/web/audio_parity.json --clobber
      - name: Commit the parity result
        run: |
          python - "$RUNNER_TEMP/web" <<'PY'
          import json, os, sys
          from pathlib import Path
          web = Path(sys.argv[1])
          manifest = json.loads((web / "audio_cnn.json").read_text())
          out = {
              "system": "${{ inputs.system }}",
              "release": "${{ inputs.release_tag }}",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "git_sha": os.environ["GITHUB_SHA"],
              "weights_sha256": manifest["weights_sha256"],
              "fold_check_max_abs_logit_diff": manifest["fold_check_max_abs_logit_diff"],
              "node_parity": json.loads((web / "audio_parity.json").read_text()),
          }
          Path("results/audio/asvspoof2019_la/browser_parity.json").write_text(json.dumps(out, indent=1) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/audio/asvspoof2019_la/browser_parity.json
          git commit -q -m "Browser audio model parity check (run ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
