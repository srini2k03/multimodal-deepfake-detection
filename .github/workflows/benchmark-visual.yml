name: Benchmark visual (DeepFakeFace)

# Trains and evaluates the visual branch on DeepFakeFace (OpenRL/DeepFakeFace on Hugging Face,
# ungated, licence tag openrail; real photos from IMDB-WIKI) on a CPU runner. Splits are
# grouped by IMDB-WIKI identity. Results are committed to results/visual/dff/; model files
# are attached to the GitHub release named by `release_tag`. See docs/BENCHMARKS.md.

on:
  workflow_dispatch:
    inputs:
      train_groups:
        description: "Identities sampled for training (each = 1 real + 3 fakes)"
        default: "5000"
      val_groups:
        default: "800"
      test_groups:
        default: "2500"
      epochs:
        description: "Max fine-tuning epochs after the 1-epoch head warm-up"
        default: "5"
      logo:
        description: "Also fine-tune without InsightFace swaps (unseen-manipulation test)"
        type: boolean
        default: true
      equalize:
        description: "Also fine-tune with every crop down-sampled to 96 px (resolution-shortcut control)"
        type: boolean
        default: true
      publish:
        type: boolean
        default: true
      release_tag:
        default: "visual-dff-v1"

permissions:
  contents: write

concurrency:
  group: benchmark-visual
  cancel-in-progress: false

env:
  TF_CPP_MIN_LOG_LEVEL: "3"
  PYTHONUNBUFFERED: "1"
  OUT: results/visual/dff

jobs:
  dff:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-bench.txt
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q aria2 > /dev/null
          pip install -q -r backend/requirements-bench.txt
          pip install -q --no-deps -e backend
      - name: Check ImageNet weights are downloadable (fail fast)
        run: python -c "import keras; keras.applications.EfficientNetV2B0(include_top=False, weights='imagenet'); print('ok')"
      - name: Download DeepFakeFace (4 zips, 5.1 GB)
        run: |
          mkdir -p "$RUNNER_TEMP/dff"
          for s in wiki inpainting insight text2img; do
            aria2c -q -x 8 -s 8 -k 32M --file-allocation=none --max-tries=10 --retry-wait=15 \
              -d "$RUNNER_TEMP/dff" -o "$s.zip" "https://huggingface.co/datasets/OpenRL/DeepFakeFace/resolve/main/$s.zip"
          done
          ls -la "$RUNNER_TEMP/dff"
          python - "$RUNNER_TEMP/dff" <<'PY'
          import sys, zipfile, pathlib
          for p in sorted(pathlib.Path(sys.argv[1]).glob("*.zip")):
              names = zipfile.ZipFile(p).namelist()
              print(p.name, len(names), names[:3])
          PY
      - name: Prepare (index, identity-grouped split, face crops, audit)
        working-directory: backend
        run: |
          python -m deepfake_detector.benchmarks.run_dff prepare --zips "$RUNNER_TEMP/dff" --work "$RUNNER_TEMP/work" \
            --train-groups ${{ inputs.train_groups }} --val-groups ${{ inputs.val_groups }} --test-groups ${{ inputs.test_groups }}
          python - "$RUNNER_TEMP/work/audit.json" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1]))
          print(json.dumps({k: a[k] for k in ("group_overlap", "full_dataset")}, indent=1)[:2500])
          for subset, v in a["selected"]["test"]["per_subset"].items():
              print(subset, v["n"], v["formats"], "w", v["width"], "h", v["height"], "kb", v["kb"], "face", v["face_detected_rate"])
          PY
          du -sh "$RUNNER_TEMP/work"
      - name: Baselines (metadata probe, frozen EfficientNetV2-B0 probe, leave-one-generator-out)
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff probe --work "$RUNNER_TEMP/work"
      - name: Fine-tune EfficientNetV2-B0
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff finetune --work "$RUNNER_TEMP/work" --epochs ${{ inputs.epochs }}
      - name: Fine-tune without InsightFace swaps
        if: inputs.logo
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff finetune --work "$RUNNER_TEMP/work" --epochs ${{ inputs.epochs }} --exclude insight
      - name: Fine-tune with resolution equalisation (96 px, both classes)
        if: inputs.equalize
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff finetune --work "$RUNNER_TEMP/work" --epochs ${{ inputs.epochs }} --equalize-px 96
      - name: Evaluate
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff evaluate --work "$RUNNER_TEMP/work" --out "../$OUT"
      - name: Robustness
        continue-on-error: true  # keep the main results even if this analysis fails
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff robustness --work "$RUNNER_TEMP/work" --out "../$OUT"
      - name: Grad-CAM statistics
        continue-on-error: true  # keep the main results even if this analysis fails
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff gradcam --work "$RUNNER_TEMP/work" --out "../$OUT" --n-per-class 150
      - name: Latency, export and parity
        continue-on-error: true  # keep the main results even if this analysis fails
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_dff latency --work "$RUNNER_TEMP/work" --out "../$OUT" --zips "$RUNNER_TEMP/dff"
      - name: Summary
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open(os.environ["OUT"] + "/metrics.json"))
          for name, s in m["systems"].items():
              t = s["test"]
              types = " ".join(f"{k}={v['roc_auc']:.3f}" for k, v in t["per_type"].items())
              fsm = t.get("face_size_matched", {}).get("pooled_roc_auc")
              print(f"{name:28s} val AUC {s['val']['roc_auc']:.4f}  test AUC {t['roc_auc']:.4f}  EER {t['eer']:.4f}  face-size-matched AUC {fsm}  {types}")
          PY
      - name: Bundle model files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          for d in "$RUNNER_TEMP"/work/models/*/; do
            n=$(basename "$d")
            for f in "$d"*; do cp "$f" "$RUNNER_TEMP/release/${n}_$(basename "$f")"; done
          done
          (cd "$RUNNER_TEMP/release" && sha256sum * > SHA256SUMS && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: dff-results
          path: |
            ${{ env.OUT }}
            ${{ runner.temp }}/release
          retention-days: 14
      - name: Publish release assets
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag }}"
          notes="EfficientNetV2-B0 face-manipulation classifiers trained on DeepFakeFace (identity-grouped split) by workflow run ${GITHUB_RUN_ID} at ${GITHUB_SHA}. Metrics: ${OUT}/metrics.json."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/release/* --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/release/* --title "Visual models (DeepFakeFace)" --notes "$notes" --target "$GITHUB_SHA"
          fi
      - name: Commit results
        if: inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -q -m "DeepFakeFace benchmark results (run ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
