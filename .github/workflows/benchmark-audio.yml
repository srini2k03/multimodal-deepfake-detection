name: Benchmark audio (ASVspoof 2019 LA)

# Trains and evaluates the audio branch on ASVspoof 2019 LA (Edinburgh DataShare, ODC-By 1.0)
# on a CPU runner. The archive is streamed from the zip (never extracted). Results (JSON +
# eval scores) are committed to results/audio/asvspoof2019_la/; model files are attached to
# the GitHub release named by `release_tag`. See docs/BENCHMARKS.md.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stratified utterances per split (empty = full dataset)"
        required: false
        default: ""
      epochs:
        description: "Max CNN epochs (early stopping on dev EER)"
        required: false
        default: "20"
      robustness_subset:
        description: "Robustness subset: spoofs per attack,bona fide"
        default: "250,1000"
      in_the_wild:
        description: "Cross-dataset test on In-the-Wild (8.2 GB download)"
        type: boolean
        default: true
      publish:
        description: "Commit results and upload the release assets"
        type: boolean
        default: true
      release_tag:
        required: false
        default: "audio-asvspoof2019-v1"

permissions:
  contents: write

concurrency:
  group: benchmark-audio
  cancel-in-progress: false

env:
  LA_URL: https://datashare.ed.ac.uk/server/api/core/bitstreams/a9f87c35-f055-4015-80e2-2fdff0d46269/content
  LA_BYTES: "7640952520"
  TF_CPP_MIN_LOG_LEVEL: "3"
  PYTHONUNBUFFERED: "1"
  OUT: results/audio/asvspoof2019_la

jobs:
  asvspoof:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-bench.txt
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q aria2 ffmpeg time > /dev/null
          pip install -q -r backend/requirements-bench.txt
          pip install -q --no-deps -e backend
          ffmpeg -version | head -1
      - name: Download ASVspoof 2019 LA (7.6 GB)
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          start=$(date +%s)
          aria2c -q -x 16 -s 16 -k 64M --file-allocation=none --max-tries=10 --retry-wait=15 \
            -d "$RUNNER_TEMP/data" -o LA.zip "$LA_URL"
          size=$(stat -c %s "$RUNNER_TEMP/data/LA.zip")
          echo "downloaded $size bytes in $(( $(date +%s) - start )) s"
          test "$size" = "$LA_BYTES"
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(len(z.namelist()), 'members')" "$RUNNER_TEMP/data/LA.zip"
      - name: Features and data audit
        working-directory: backend
        run: |
          limit=""; if [ -n "${{ inputs.limit }}" ]; then limit="--limit ${{ inputs.limit }}"; fi
          /usr/bin/time -v python -m deepfake_detector.benchmarks.run_asvspoof features \
            --archive "$RUNNER_TEMP/data/LA.zip" --work "$RUNNER_TEMP/work" $limit 2> "$RUNNER_TEMP/time_features.txt"
          grep -E "Elapsed|Maximum resident" "$RUNNER_TEMP/time_features.txt"
          du -sh "$RUNNER_TEMP/work/features"; df -h /
      - name: Train CNN (untrimmed audio)
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_asvspoof train --work "$RUNNER_TEMP/work" --system cnn --epochs ${{ inputs.epochs }}
      - name: Train CNN (silence-trimmed audio)
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_asvspoof train --work "$RUNNER_TEMP/work" --system cnn_trim --epochs ${{ inputs.epochs }}
      - name: Evaluate (dev + eval, all systems)
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_asvspoof evaluate --archive "$RUNNER_TEMP/data/LA.zip" --work "$RUNNER_TEMP/work" --out "../$OUT"
      - name: Robustness (stratified eval subset)
        working-directory: backend
        run: |
          IFS=, read -r per_attack bonafide <<< "${{ inputs.robustness_subset }}"
          python -m deepfake_detector.benchmarks.run_asvspoof robustness --archive "$RUNNER_TEMP/data/LA.zip" \
            --work "$RUNNER_TEMP/work" --out "../$OUT" --per-attack "$per_attack" --bonafide "$bonafide"
      - name: Latency, export and parity
        working-directory: backend
        run: python -m deepfake_detector.benchmarks.run_asvspoof latency --archive "$RUNNER_TEMP/data/LA.zip" --work "$RUNNER_TEMP/work" --out "../$OUT"
      - name: Cross-dataset test (In-the-Wild)
        if: inputs.in_the_wild
        working-directory: backend
        run: |
          aria2c -q -x 8 -s 8 -k 64M --file-allocation=none --max-tries=10 --retry-wait=15 -d "$RUNNER_TEMP/data" \
            -o itw.zip "https://huggingface.co/datasets/mueller91/In-The-Wild/resolve/main/release_in_the_wild.zip"
          ls -la "$RUNNER_TEMP/data"; df -h /
          python -m deepfake_detector.benchmarks.run_asvspoof itw --zip "$RUNNER_TEMP/data/itw.zip" --work "$RUNNER_TEMP/work" --out "../$OUT"
      - name: Summary
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open(os.environ["OUT"] + "/metrics.json"))
          for name, s in m["systems"].items():
              e = s["eval"]
              print(f"{name:24s} dev EER {s['dev']['eer']:.4f}  eval EER {e['eer']:.4f}  min t-DCF {e.get('min_tdcf', float('nan')):.4f}  AUC {e['roc_auc']:.4f}")
          p = os.environ["OUT"] + "/cross_dataset_in_the_wild.json"
          if os.path.exists(p):
              for name, s in json.load(open(p))["systems"].items():
                  print(f"In-the-Wild {name:24s} EER {s['eer']:.4f}  AUC {s['roc_auc']:.4f}")
          PY
          ls -la "$OUT"
      - name: Bundle model files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP"/work/export/* "$RUNNER_TEMP/release/"
          cp "$RUNNER_TEMP"/work/models/cnn/train.json "$RUNNER_TEMP/release/cnn_train.json"
          cp "$RUNNER_TEMP"/work/models/cnn_trim/train.json "$RUNNER_TEMP/release/cnn_trim_train.json"
          (cd "$RUNNER_TEMP/release" && sha256sum * > SHA256SUMS && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: asvspoof-results
          path: |
            ${{ env.OUT }}
            ${{ runner.temp }}/release
          retention-days: 14
      - name: Publish release assets
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag }}"
          notes="Audio countermeasure models trained on ASVspoof 2019 LA train (ODC-By 1.0) by workflow run ${GITHUB_RUN_ID} at ${GITHUB_SHA}. Metrics: ${OUT}/metrics.json."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/release/* --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/release/* --title "Audio CM models (ASVspoof 2019 LA)" --notes "$notes" --target "$GITHUB_SHA"
          fi
      - name: Commit results
        if: inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -q -m "ASVspoof 2019 LA benchmark results (run ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
