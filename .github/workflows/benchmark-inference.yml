name: Benchmark inference (served models)

# End-to-end CPU latency of the API's detector with the released weights: video at 8 / 16 / 32
# sampled frames with and without Grad-CAM, a single image, and 10 s / 60 s audio. Results are
# committed to results/inference/latency.json.

on:
  workflow_dispatch:
    inputs:
      audio_system:
        default: "cnn_trim"

permissions:
  contents: write

concurrency:
  group: benchmark-inference
  cancel-in-progress: false

jobs:
  latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg > /dev/null
          pip install -q -r backend/requirements-bench.txt -r backend/requirements-base.txt
          pip install -q --no-deps -e backend
      - name: Fetch released weights
        working-directory: backend
        run: python scripts/fetch_weights.py --audio-system ${{ inputs.audio_system }}
      - name: Measure
        working-directory: backend
        run: python scripts/bench_inference.py --config configs/serve.yaml --out ../results/inference/latency.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/inference/latency.json
          git commit -q -m "Inference latency of the served models (run ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
